---
- name: Ensure connection is ready
  hosts: all
  gather_facts: no
  tasks:
    - name: Wait for SSH connection
      wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5

- name: Install Docker on hosts
  hosts: all
  become: true
  roles:
    - docker

- name: Deploy Database Server 
  hosts: db
  become: true
  vars_files:
    - group_vars/secrets/vault.yml
  roles:
    - db

- name: Deploy Web Server
  hosts: web
  become: true
  vars_files:
    - group_vars/secrets/vault.yml
  roles:
    - web
  
- name: Validation E2E
  hosts: localhost
  connection: local
  gather_facts: no
  roles:
    - tests
