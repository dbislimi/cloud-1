services:
  nginx:
    image: nginx:1.30.5-alpine
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_data:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - wordpress
      - phpmyadmin
  wordpress:
    image: wordpress:7.1.0-php8.5-fpm-alpine
    container_name: wordpress_app
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
      - ./php-fpm-healthcheck.conf:/usr/local/etc/php-fpm.d/zz-healthcheck.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: phpmyadmin_app
    env_file:
      - .env
    environment:
      - PMA_HOST=${WORDPRESS_DB_HOST}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${WORDPRESS_DB_HOST},nfsvers=4.2,rw,hard"
      device: ":/opt/data/wordpress"